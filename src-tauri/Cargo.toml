[package]
name = "ragcreator"
version = "0.1.0"
description = "RAG pipeline builder for medical guidelines"
authors = []
edition = "2021"

# iOS links the app as a static library rather than running a binary, so the
# crate has to build both ways; `run()` lives in lib.rs for that reason.
[lib]
name = "ragcreator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only: the pipeline shells out to Python, and only the desktop app
# picks or saves files.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }

# Resolving the app's iCloud Drive container is a Foundation call; see
# storage.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
