name: ragcreator
options:
  bundleIdPrefix: com.ragcreator.app
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: RAGCreator
      PRODUCT_BUNDLE_IDENTIFIER: com.ragcreator.app
      # Signing voor een echt toestel. Staat hier en niet in Xcode, want
      # xcodegen genereert het .xcodeproj opnieuw uit dit bestand en gooit
      # wijzigingen die direct in Xcode gemaakt zijn weg.
      DEVELOPMENT_TEAM: SBB8YRNS5R
      CODE_SIGN_STYLE: Automatic
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ragcreator_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: ragcreator_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: ragcreator_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # iOS 26+ eist de UIScene-lifecycle: een app zonder deze sleutel wordt
        # bij het opzetten van zijn eerste scene afgeschoten
        # (_UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption,
        # EXC_BREAKPOINT) of toont een leeg wit scherm.
        #
        # tao heeft er een scene-delegate voor (TaoSceneDelegate), maar zet die
        # alleen in als UIApplicationSupportsMultipleScenes hier true is — zie
        # multiple_scenes_enabled() in tao's ios/scene.rs. UISceneConfigurations
        # blijft leeg: tao levert de configuratie zelf via
        # application:configurationForConnectingSceneSession:options:.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Makes the app's iCloud container visible as "RAGCreator" in the
        # Files app and in iCloud Drive on the Mac. Without it the container
        # syncs but nobody can see it, and the desktop app has nowhere to
        # write that the user can find. See docs/IOS.md.
        NSUbiquitousContainers:
          "iCloud.com.ragcreator.app":
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: RAGCreator
            NSUbiquitousContainerSupportedFolderLevels: Any
        # The fallback storage.rs uses when iCloud is unavailable: the app's
        # own Documents folder, which the user can drop project folders into.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: ragcreator_iOS/ragcreator_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a