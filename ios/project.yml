# Native iOS app (SwiftUI). Generate the Xcode project with:
#   cd ios && xcodegen generate
# The .xcodeproj is derived from this file and not hand-edited.
name: RAGCreator
options:
  bundleIdPrefix: com.ragcreator
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: SBB8YRNS5R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RAGCreator:
    type: application
    platform: iOS
    sources:
      - path: RAGCreator
    settings:
      base:
        # Its own bundle id while it is built next to the Tauri app; both
        # read the same iCloud container (see the entitlements below).
        PRODUCT_BUNDLE_IDENTIFIER: com.ragcreator.native
        PRODUCT_NAME: RAGCreator
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: RAGCreator/Info.plist
      properties:
        CFBundleDisplayName: RAGCreator β
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Same container the desktop app writes to; visible as "RAGCreator"
        # in iCloud Drive.
        NSUbiquitousContainers:
          "iCloud.com.ragcreator.app":
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: RAGCreator
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Fallback without iCloud: the app's own Documents folder, reachable
        # from the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: RAGCreator/RAGCreator.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ragcreator.app
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.ragcreator.app
